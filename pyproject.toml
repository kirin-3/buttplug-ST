[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "buttplug-st"
version = "0.2.0"
description = "REST bridge between SillyTavern and buttplug.io-compatible devices via Intiface Central"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [{ name = "Kirin" }]
keywords = ["buttplug", "intiface", "sillytavern", "rest"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = [
    "buttplug>=1.0.0,<2",
    "pydantic>=2",
    "quart>=0.23",
    "quart-cors>=0.8",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[project.scripts]
buttplug-st = "buttplug_st.app:main"

[project.urls]
Homepage = "https://github.com/kirin-3/buttplug-ST"

[tool.hatch.build.targets.wheel]
packages = ["buttplug_st"]

[tool.hatch.build.targets.sdist]
include = ["/buttplug_st", "/README.md", "/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".venv", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["buttplug_st"]
